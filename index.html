<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Evaluator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        input[type="password"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; transition: border-color 0.2s; }
        input[type="password"]:focus { border-color: #4a90e2; outline: none; }
        .meter { height: 8px; width: 100%; background: #eee; border-radius: 4px; margin-top: 15px; overflow: hidden; }
        .meter-bar { height: 100%; width: 0%; transition: width 0.3s, background-color 0.3s; }
        .status { font-weight: bold; margin-top: 8px; display: inline-block; font-size: 14px; }
        .tips { margin-top: 15px; padding-left: 20px; font-size: 13px; color: #666; line-height: 1.5; }
    </style>
</head>
<body>

<div class="card">
    <h2>Secure Check</h2>
    <input type="password" id="pwInput" placeholder="Enter password to test..." oninput="evaluatePassword()">
    <div class="meter"><div id="meterBar" class="meter-bar"></div></div>
    <div>Status: <span id="statusText" class="status">Type a password...</span></div>
    <ul id="tipsList" class="tips"></ul>
</div>

<script>
    async function evaluatePassword() {
        const password = document.getElementById('pwInput').value;
        const meterBar = document.getElementById('meterBar');
        const statusText = document.getElementById('statusText');
        const tipsList = document.getElementById('tipsList');

        if (!password) {
            meterBar.style.width = '0%';
            statusText.innerText = 'Type a password...';
            statusText.style.color = '#333';
            tipsList.innerHTML = '';
            return;
        }

        try {
            const response = await fetch('/api/check', {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: password
            });
            const data = await response.json();

            // Calculate percentage width mapping from 0-6 score scale
            const percentWidth = (data.score / 6) * 100;
            meterBar.style.width = percentWidth + '%';

            // Configure matching colors dynamically
            let color = '#ff4d4d'; // Red for Weak
            if (data.rating === 'Moderate') color = '#ff9933'; // Orange
            if (data.rating === 'Strong') color = '#2db300'; // Green

            meterBar.style.background = color;
            statusText.innerText = data.rating + ` (${data.score}/6)`;
            statusText.style.color = color;

            // Render actionable suggestion fragments
            tipsList.innerHTML = data.feedback.map(tip => `<li>${tip}</li>`).join('');
        } catch (error) {
            console.error('Error contacting backend evaluator API:', error);
        }
    }
</script>

</body>
</html>
